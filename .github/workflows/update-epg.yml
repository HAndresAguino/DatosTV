name: update-epg
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  grab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: git clone --depth 1 -b master https://github.com/iptv-org/epg.git tool
      - run: cd tool && npm install
      - run: cd tool && npm run grab --- --sites=directv.com.ar --output=../guide.xml
      - run: |
          git config user.name "epg-bot"
          git config user.email "epg-bot@users.noreply.github.com"
          git add guide.xml
          git commit -m "update guide" || exit 0
          git push
